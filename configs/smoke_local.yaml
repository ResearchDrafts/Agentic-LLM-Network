# Local smoke test via Ollama. Runs on Apple Silicon, which vLLM cannot
# target, so this is the fastest way to see the system work on your own
# machine before touching a GPU notebook.
#
#   brew install ollama          (or download from ollama.com)
#   ollama serve                 (leave running in one terminal)
#   ollama pull qwen2.5:3b       (~2 GB; use 7b if you have the headroom)
#   python run_simulation.py configs/smoke_local.yaml
#
# Expect: runs/smoke_local/interactions.jsonl with exactly 4 rows.
#
# This is for proving the pipeline works, NOT for research results. A 3B
# model is weak at exactly the Hinglish generation RQ1 depends on, and the
# persona pool here has 4 entries. Use vLLM on Kaggle for a real campaign.

run_id: smoke_local
rq_target: RQ1_RQ2
topic: whether remote work should be the default for office jobs

alpha: 0.5
M: 4          # 4 agents, one per persona in test_pool
N: 2
K: 1          # 4 LLM calls total
trial_number: 1

language_condition: english

# Must match `ollama list` exactly, including the :tag suffix.
model_backend_id: ollama/qwen2.5:3b

# Ollama's native API. Note this is NOT the /v1 OpenAI-compatible path:
# litellm's ollama provider talks to the native endpoint.
api_base: http://localhost:11434

stance_scale: [1, 2, 3, 4, 5, 6, 7]
stance_low_label: remote work should never be the default
stance_high_label: remote work should always be the default

persona_pool_id: test_pool

meme_injection:
  enabled: false

seed: 42
temperature: 0.7

rate_limits: {}
checkpoint_every_n_turns: 1
