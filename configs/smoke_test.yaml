# Smallest useful run: 5 agents, 1 turn, 5 LLM calls.
#
# Run this FIRST, before any real campaign. It is the cheapest way to find
# plumbing problems (wrong api_base, model not served, HF_TOKEN missing,
# malformed replies), and it produces the throughput number needed to plan
# a real campaign.
#
#   vllm serve Qwen/Qwen2.5-7B-Instruct --dtype half --port 8000
#   python run_simulation.py configs/smoke_test.yaml
#
# Expect: runs/smoke_test/interactions.jsonl with exactly 5 rows.

run_id: smoke_test
rq_target: RQ1_RQ2
topic: whether remote work should be the default for office jobs

alpha: 0.5
M: 5          # 5 agents
N: 2          # each sees 2 neighbours
K: 1          # 1 turn -> 5 calls total
trial_number: 1

language_condition: english

# Must match what vLLM is serving. The bare last segment
# ("Qwen2.5-7B-Instruct") is the pricing_table.yaml key.
model_backend_id: hosted_vllm/Qwen/Qwen2.5-7B-Instruct

# Where the server is. Without this litellm routes on the prefix alone and
# never reaches localhost. Change the port if you served on a different one.
api_base: http://localhost:8000/v1

stance_scale: [1, 2, 3, 4, 5, 6, 7]
stance_low_label: remote work should never be the default
stance_high_label: remote work should always be the default

# 4-entry test pool. Fine for a smoke test; a real campaign wants more.
persona_pool_id: test_pool

meme_injection:
  enabled: false

seed: 42
temperature: 0.7

# Empty on purpose: let all M agents dispatch concurrently so vLLM can batch
# them. Populating this serializes the provider to one request at a time.
rate_limits: {}

checkpoint_every_n_turns: 1
