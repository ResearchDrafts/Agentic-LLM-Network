# Hand-maintained. Must be updated manually whenever a provider changes
# pricing -- not derived from anything else. Keyed by
# provider -> model_id -> modality -> {prompt_per_1k, completion_per_1k}.
#
# The model ids below are illustrative placeholders carried over from the
# design documents, not a confirmed final choice of which models this
# project will actually run against (see Question E in the plan) -- update
# this table once real models are selected.

openai:
  gpt-4o:
    text: {prompt_per_1k: 0.0050, completion_per_1k: 0.0150}
    vision: {prompt_per_1k: 0.0050, completion_per_1k: 0.0150}
  gpt-4o-mini:
    text: {prompt_per_1k: 0.00015, completion_per_1k: 0.0006}
    vision: {prompt_per_1k: 0.00015, completion_per_1k: 0.0006}
  gpt-3.5-turbo:
    text: {prompt_per_1k: 0.0005, completion_per_1k: 0.0015}
anthropic:
  claude-sonnet-4-6:
    text: {prompt_per_1k: 0.0030, completion_per_1k: 0.0150}
    vision: {prompt_per_1k: 0.0030, completion_per_1k: 0.0150}
google:
  gemini-2.0-flash:
    text: {prompt_per_1k: 0.0001, completion_per_1k: 0.0004}
    vision: {prompt_per_1k: 0.0001, completion_per_1k: 0.0004}
local:
  llama-3.1-70b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  llama-3.1-8b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}

# --- Zero-cost backends (phase5,6.md Section A) ---------------------------
# Unlike the illustrative rates above, these zeroes are real. CostTracker
# raises on a missing entry, so every model actually used must appear here
# even when nothing is billed per token.
#
# Keys are BARE model ids: ModelGateway._bare_model_id() strips the provider
# prefix, so "hosted_vllm/Qwen/Qwen2.5-7B-Instruct" looks up
# hosted_vllm -> Qwen2.5-7B-Instruct.

# Self-hosted via vLLM. Compute is rented by the hour (Kaggle free, Colab
# units), never billed per token, so per-call cost accounting does not apply
# and total_cost_usd stays 0.0 by design rather than by oversight.
hosted_vllm:
  # 3B fits a free-tier 16 GB T4 with room for KV cache; 7B needs ~15 GB of
  # weights alone and wants --max-model-len trimmed or a larger device.
  Qwen2.5-3B-Instruct:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  Qwen2.5-7B-Instruct:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  Qwen2.5-14B-Instruct:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  # VL models need the vision modality too: generate() selects
  # modality="vision" whenever an image is attached, and a missing entry
  # would raise on the first meme turn a receiver sees.
  Qwen2.5-VL-7B-Instruct:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
    vision: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  Qwen2.5-VL-3B-Instruct:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
    vision: {prompt_per_1k: 0.0, completion_per_1k: 0.0}

# Hosted free tiers, kept as the fallback path when GPU hours run out.
groq:
  gpt-oss-120b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  gpt-oss-20b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  qwen3.8-27b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
cerebras:
  gpt-oss-120b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  glm-4.7:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}

# Ollama, running locally. Free, and the only way to serve a model on Apple
# Silicon, which vLLM cannot target. Note Ollama keeps the ":tag" suffix as
# part of the model name, so these keys include it.
ollama:
  qwen2.5:3b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  qwen2.5:7b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  llama3.2:3b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
  llama3.1:8b:
    text: {prompt_per_1k: 0.0, completion_per_1k: 0.0}
